# =============================================================================
# build-monolith — build & push the all-in-one trial image to GHCR
# =============================================================================
# The monolith bundles docker:dind + Scutum's release compose so a single Fly
# machine boots the whole stack. Trial-provisioner pulls this image when it
# spins up a per-user trial.
#
# Triggers:
#   - push to main that touches infra/fly-monolith/* — auto-rebuild
#   - manual dispatch — for re-builds without a push
#
# Image: ghcr.io/<owner>/scutum-monolith:<sha-7> + :latest + :v<scutum_version>
#
# Single-arch (linux/amd64) — Fly IAD region is x86. Adding arm64 means cold
# start gets cross-arch slow. If we ever need multi-region we re-evaluate.
# =============================================================================

name: build-monolith

on:
  push:
    branches: ["main"]
    paths:
      - "infra/fly-monolith/**"
      - ".github/workflows/build-monolith.yml"
  workflow_dispatch:
    inputs:
      scutum_version:
        description: "Scutum release the monolith bundles (e.g. 0.1.0)."
        required: false
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.scutum_version || '0.1.0' }}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/${OWNER}/scutum-monolith"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "tag_version=${IMAGE}:v${VERSION}"
            echo "tag_sha=${IMAGE}:${SHORT_SHA}"
            echo "tag_latest=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push scutum-monolith
        uses: docker/build-push-action@v5
        with:
          context: ./infra/fly-monolith
          file: ./infra/fly-monolith/Dockerfile
          # x86 only — Fly IAD region. Adding arm64 doubles build time and
          # right now we have no arm64 region in the trial config.
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            SCUTUM_VERSION=${{ steps.tags.outputs.version }}
          tags: |
            ${{ steps.tags.outputs.tag_version }}
            ${{ steps.tags.outputs.tag_sha }}
            ${{ steps.tags.outputs.tag_latest }}
          cache-from: type=gha,scope=scutum-monolith
          cache-to:   type=gha,scope=scutum-monolith,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.title=scutum-monolith
            org.opencontainers.image.description=All-in-one Scutum stack image for Fly trial machines.
