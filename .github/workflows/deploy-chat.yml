name: Deploy chat.scutum.dev

on:
  push:
    branches: [main]
    paths:
      - "ui/chat/**"
      - ".github/workflows/deploy-chat.yml"
  workflow_dispatch: # manual trigger from the Actions tab

# Only one chat deploy at a time — if a second push comes in mid-deploy,
# cancel the in-flight one and run the new commit instead.
concurrency:
  group: deploy-chat
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + push to Vercel production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/chat
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/chat/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment + project metadata
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
