# =============================================================================
# release-images — build & push Scutum service images to GHCR on tag
# =============================================================================
# Triggers:
#   - push of a tag matching `v*` (e.g. v0.1.0) — builds release-tagged images
#   - manual dispatch — for re-running a failed release
#
# Image naming: ghcr.io/<owner>/scutum-<service>:<version>
# Both :<version> and :latest are pushed on success.
#
# Multi-arch: linux/amd64 + linux/arm64 (Oracle Always Free is ARM, AWS
# Graviton is ARM, Apple Silicon dev is ARM — single-arch shipping is no
# longer acceptable in 2026).
# =============================================================================

name: release-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-api
            context: ./src/admin-api
            dockerfile: ./src/admin-api/Dockerfile
            contexts: |
              shared=./src/shared
              platform_config=./config
          - name: admin-ui
            context: ./ui/admin
            dockerfile: ./ui/admin/Dockerfile
            contexts: ""
          - name: docs
            context: ./docs
            dockerfile: ./docs/Dockerfile
            contexts: ""
          - name: litellm
            context: ./config/litellm
            dockerfile: ./config/litellm/Dockerfile
            contexts: ""
          - name: sre-agent
            context: ./src/sre-agent
            dockerfile: ./src/sre-agent/Dockerfile
            contexts: |
              shared=./src/shared
          - name: cost-predictor
            context: ./src/cost-predictor
            dockerfile: ./src/cost-predictor/Dockerfile
            contexts: |
              shared=./src/shared
          - name: budget-webhook
            context: ./src/budget-webhook
            dockerfile: ./src/budget-webhook/Dockerfile
            contexts: |
              shared=./src/shared

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "could not resolve a version" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Owner lowercase (GHCR requires lowercase)
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bail if Dockerfile missing
        run: |
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "Dockerfile missing for ${{ matrix.name }} — skipping (this service has no buildable image yet)"
            exit 0
          fi

      - name: Build & push scutum-${{ matrix.name }}
        if: hashFiles(matrix.dockerfile) != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/scutum-${{ matrix.name }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/scutum-${{ matrix.name }}:latest
          build-contexts: ${{ matrix.contexts }}
          cache-from: type=gha,scope=scutum-${{ matrix.name }}
          cache-to:   type=gha,scope=scutum-${{ matrix.name }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.title=scutum-${{ matrix.name }}
            org.opencontainers.image.description=Scutum self-hosted AI control plane — ${{ matrix.name }}

  release-summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Print release summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Scutum v${{ steps.ver.outputs.version }} published

          Customer install:

          \`\`\`bash
          curl -fsSL https://scutum.dev/install.sh | sh -s -- --version ${{ steps.ver.outputs.version }}
          \`\`\`

          Images pushed to GHCR:
          - ghcr.io/${{ github.repository_owner }}/scutum-admin-api:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-admin-ui:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-docs:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-litellm:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-sre-agent:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-cost-predictor:${{ steps.ver.outputs.version }}
          - ghcr.io/${{ github.repository_owner }}/scutum-budget-webhook:${{ steps.ver.outputs.version }}
          EOF
