name: Tests

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  python-unit-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r src/admin-api/requirements.txt
          pip install -r src/cost-predictor/requirements.txt
          pip install -r src/budget-webhook/requirements.txt
          pip install -r src/finops-reporter/requirements.txt
          pip install -r src/semantic-cache/requirements.txt
          pip install -r src/policy-router/requirements.txt
          pip install -r src/workflow-engine/requirements.txt
          pip install -r src/a2a-runtime/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            htmlcov/

  frontend-build:
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: ui/admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  python-integration-tests:
    runs-on: ubuntu-latest
    needs: [python-unit-tests]
    continue-on-error: true  # Integration tests need running services; non-blocking until CI has docker-compose
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r src/admin-api/requirements.txt
          pip install -r src/cost-predictor/requirements.txt
          pip install -r src/budget-webhook/requirements.txt
          pip install -r src/finops-reporter/requirements.txt
          pip install -r src/semantic-cache/requirements.txt
          pip install -r src/policy-router/requirements.txt
          pip install -r src/workflow-engine/requirements.txt
          pip install -r src/a2a-runtime/requirements.txt

      - name: Run integration tests
        run: >-
          pytest
          tests/integration/test_admin_api_endpoints.py
          tests/integration/test_cost_predictor_api.py
          tests/integration/test_budget_webhook_api.py
          tests/integration/test_finops_reporter_api.py
          tests/integration/test_semantic_cache_api.py
          tests/integration/test_policy_router_api.py
          tests/integration/test_workflow_engine_api.py
          tests/integration/test_a2a_runtime_api.py
          -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-unit-tests, frontend-build]
    strategy:
      matrix:
        service:
          - { name: admin-api, context: ./src/admin-api }
          - { name: admin-ui, context: ./ui/admin }
          - { name: policy-router, context: ./src/policy-router }
          - { name: semantic-cache, context: ./src/semantic-cache }
          - { name: cost-predictor, context: ./src/cost-predictor }
          - { name: budget-webhook, context: ./src/budget-webhook }
          - { name: finops-reporter, context: ./src/finops-reporter }
          - { name: workflow-engine, context: ./src/workflow-engine }
          - { name: a2a-runtime, context: ./src/a2a-runtime }
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: >-
          docker build
          --build-context shared=./src/shared
          -t ${{ matrix.service.name }}:test
          ${{ matrix.service.context }}
