# Agent Gateway Configuration
# Documentation: https://agentgateway.dev/docs/configuration
#
# NOTE: This file is NOT used at runtime in Docker Compose.
# The admin-api writes the config from the database to a shared volume.
# This file is only a reference / fallback for local development.
#
# To manage MCP servers, use the Admin UI at http://localhost:5173
# or the Admin API: POST /api/v1/mcp-servers
#
# Architecture:
#   LLM:  Client -> LiteLLM (port 4000) -> OpenAI/Anthropic/XAI
#   MCP:  Client -> Agent Gateway (port 3000) -> MCP Servers (stdio)
#   A2A:  Client -> Agent Gateway (port 3000) -> AI Agents

binds:
  - port: 3000
    listeners:
      - routes:
          - policies:
              cors:
                allowOrigins:
                  - "*"
                allowHeaders:
                  - mcp-protocol-version
                  - content-type
                  - authorization
                  - accept
                exposeHeaders:
                  - Mcp-Session-Id
            backends:
              - mcp:
                  targets: []
