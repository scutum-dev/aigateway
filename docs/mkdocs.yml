site_name: AI Control Plane Platform
site_description: Unified AI infrastructure — 100+ models, 9 providers, intelligent routing, cost management
site_url: https://docs.aicontrolplane.dev

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: guides/quickstart.md
      - API Integration: guides/api-integration.md
      - Comparison: guides/comparison.md
  - Features:
      - Model Routing: guides/model-routing.md
      - Guardrails: guides/guardrails.md
      - Semantic Caching: guides/semantic-caching.md
      - MCP Servers: guides/mcp-servers.md
      - Workflows: guides/workflows.md
      - Cost Management: guides/cost-management.md
  - Integration:
      - LiteLLM Deep Dive: guides/litellm-integration.md
      - Agent Gateway Deep Dive: guides/agentgateway-integration.md
  - Operations:
      - Admin Guide: guides/admin-guide.md
      - Observability: guides/observability.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
