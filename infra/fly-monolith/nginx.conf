# Scutum monolith reverse proxy — front-of-house for the Fly machine.
#
# Routes inbound :80 to the right Docker-Compose service inside the same
# machine. dind's bridge network exposes container ports on localhost from
# the host's perspective, so we point at 127.0.0.1.

worker_processes 1;
events { worker_connections 256; }

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Resolver for any DNS lookups (rare since we hit localhost).
    resolver 127.0.0.11 valid=10s;

    # Upstreams. Ports match what docker-compose.release.yaml exposes on the host.
    upstream admin_ui      { server 127.0.0.1:5173; }
    upstream admin_api     { server 127.0.0.1:8086; }
    upstream litellm_proxy { server 127.0.0.1:4000; }
    upstream docs_site     { server 127.0.0.1:8089; }

    # Fallback "still booting" page used while the stack is coming up.
    server {
        listen 80 default_server;
        client_max_body_size 16M;

        # While dockerd + the stack come up, the upstreams aren't reachable.
        # error_page redirects them to a friendly waiting page rather than
        # bare nginx 502s.
        error_page 502 503 504 /booting;
        location = /booting {
            root /var/www/welcome;
            try_files /index.html =500;
            internal;
        }

        # OpenAI-compatible proxy. Long timeouts so streaming completions
        # don't get axed mid-token.
        location /v1/ {
            proxy_pass http://litellm_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # admin-api endpoints (JWT auth-gated; trial user gets a token at signup).
        location /api/ {
            proxy_pass http://admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Bundled docs (trial users land in the same docs site customers do).
        location /docs/ {
            proxy_pass http://docs_site/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Admin UI is built with VITE_BASE=/admin/ (see ui/admin/Dockerfile),
        # so its index.html references /admin/assets/*.{js,css}. Strip the
        # /admin/ prefix before forwarding so the upstream nginx serves files
        # from /usr/share/nginx/html/assets/ rather than /usr/share/nginx/html/admin/assets/.
        # The trailing slash on proxy_pass is what does the strip.
        location /admin/ {
            proxy_pass http://admin_ui/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bare / serves admin-ui's index.html (which then loads /admin/assets/*
        # via the location above). Same upstream, no prefix strip needed since
        # admin-ui's nginx serves index.html from /.
        location / {
            proxy_pass http://admin_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
