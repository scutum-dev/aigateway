<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booting your Scutum trial…</title>
  <meta http-equiv="refresh" content="5">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      max-width: 540px; margin: 96px auto; padding: 0 24px;
      color: #0A0A0A; line-height: 1.6;
    }
    h1 {
      font-family: 'Iowan Old Style', Georgia, serif; font-style: italic;
      font-size: 48px; font-weight: 400; margin: 0 0 16px;
    }
    p { color: #525252; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      margin-right: 8px; border: 2px solid #D4D4D4;
      border-top-color: #0A0A0A; border-radius: 50%;
      animation: spin 0.8s linear infinite; vertical-align: -3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .small { font-size: 13px; color: #6B7280; margin-top: 32px; }
  </style>
</head>
<body>
  <h1>Booting your trial.</h1>
  <p><span class="spinner"></span> The Scutum stack is starting inside your trial machine. Usually under 60 seconds. This page reloads automatically.</p>
  <p class="small">If you're still seeing this after a few minutes, email <a href="mailto:hello@scutum.dev">hello@scutum.dev</a>.</p>
</body>
</html>
