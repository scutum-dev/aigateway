apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck-ui
  labels:
    app: deck-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deck-ui
  template:
    metadata:
      labels:
        app: deck-ui
    spec:
      containers:
        - name: deck-ui
          image: deck-ui:latest  # Replaced by Makefile
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deck-ui
  labels:
    app: deck-ui
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: deck-ui
---
