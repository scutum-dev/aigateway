# Map `Accept: text/markdown` requests so AI agents that prefer markdown
# get a markdown variant of the homepage; browsers (Accept: text/html)
# get the regular HTML. RFC 7231 content negotiation, Cloudflare's
# "Markdown for Agents" pattern.
map $http_accept $homepage_variant {
    default                 "/index.html";
    "~*text/markdown"       "/index.md";
}

# Custom MIME for .md so we serve text/markdown explicitly.
types {
    text/markdown md;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/markdown;

    # Proxy demo-request endpoints to landing-backend.
    location /api/ {
        proxy_pass http://landing-backend:8093/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Trial-signup endpoints live in admin-api, not landing-backend. More-specific
    # prefix wins over /api/ above so the /try flow reaches admin-api directly.
    location /api/v1/trial-signup {
        proxy_pass http://admin-api:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # OpenAI-compatible LLM proxy. chat.scutum.dev (and any external API
    # client) calls https://scutum.dev/v1/chat/completions; we forward to
    # the LiteLLM container which handles routing across providers, audit,
    # and cost tracking. Long timeouts so streaming completions don't get
    # axed mid-token; buffering off so SSE chunks reach the client live.
    location /v1/ {
        proxy_pass http://litellm:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health passthrough so external monitors can ping the same origin.
    location = /health {
        proxy_pass http://landing-backend:8093/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Bare /docs → /docs/ so trailing-slash internal links resolve.
    location = /docs {
        return 301 /docs/;
    }

    # Agent-discovery endpoints under /.well-known/. RFC 8615.
    # JSON content-type set explicitly; X-Robots-Tag noindex so they don't
    # show up in search-result indexes.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # api-catalog uses the registered linkset+json media type per RFC 9264.
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag "noindex" always;
        try_files /.well-known/api-catalog =404;
    }

    # Markdown-for-Agents content negotiation on the homepage. Agents that
    # send `Accept: text/markdown` get /index.md; everything else gets
    # /index.html. The Vary header tells caches not to mix the two.
    location = / {
        add_header Vary "Accept" always;
        # RFC 8288 Link headers: agent-discovery hints. service-doc points at
        # the human docs site; describedby points at the agent-skills index;
        # version-history points at the changelog; license at /terms.
        add_header Link '</docs/>; rel="service-doc"' always;
        add_header Link '</.well-known/agent-skills/index.json>; rel="describedby"; type="application/json"' always;
        add_header Link '</changelog/>; rel="version-history"' always;
        add_header Link '</privacy/>; rel="privacy-policy"' always;
        add_header Link '</terms/>; rel="terms-of-service"' always;
        try_files $homepage_variant =404;
    }

    # Customer install one-liner: `curl -fsSL https://scutum.dev/install.sh | sh`
    # The script (and all release artifacts) are baked into the landing-ui
    # image — not redirected to GitHub raw, because the source repo is private.
    location = /install.sh {
        default_type text/x-shellscript;
        try_files /install.sh =404;
    }

    # Versioned release artifacts (install.sh, scutum CLI, compose file,
    # env template, license public key). The installer fetches from here.
    # Long-cache anything under /release/vX.Y.Z/ since artifacts are immutable.
    location ^~ /release/ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }

    # Proxy mkdocs site at /docs/. Trailing slash on proxy_pass strips the
    # /docs prefix so docs-site sees /, /guides/, /finops/, etc. mkdocs is
    # built with site_url=https://scutum.dev/docs/ so internal links resolve.
    # `^~` modifier makes this prefix location win over the asset-extension
    # regex below — without it, requests for /docs/assets/*.css get hijacked
    # by the regex and 404 against landing's local filesystem.
    location ^~ /docs/ {
        proxy_pass http://docs-site:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
