         C 28.5 49.5, 23.5 47.5, 20.0 44.0
         L 18.0 47.5
         C 22.0 51.5, 27.5 53.5, 33.5 53.0
         C 41.0 52.3, 46.5 47.5, 47.0 42.0
         C 47.5 36.5, 44.0 33.0, 38.0 30.5
