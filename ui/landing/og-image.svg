<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenGraph card. 1200x630 — the platform standard for Slack/LinkedIn/Twitter
  previews. Black-on-black brand voice; Instrument Serif on top for editorial weight.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Subtle shield-shape watermark in the background, very low opacity -->
  <g opacity="0.04" transform="translate(900,80)">
    <path d="M 200 0 L 320 60 L 320 280 C 320 380, 260 460, 200 500 C 140 460, 80 380, 80 280 L 80 60 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Mark in top-left -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="64" height="64" rx="9" ry="9" fill="#FFFFFF"/>
    <path
