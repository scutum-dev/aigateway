  <text x="168" y="128"
        font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif"
        font-size="44" font-style="italic" font-weight="400" fill="#FAFAFA"
        letter-spacing="-0.5">Scutum</text>

  <!-- Headline -->
  <text x="80" y="320"
        font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif"
        font-size="86" font-weight="400" fill="#FFFFFF" letter-spacing="-1.5">The unified <tspan font-style="italic">control plane</tspan></text>
